<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>White Bay Villas — Reports</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --line:#e4e8ee; --txt:#1b2430; --muted:#64748b;
    --accent:#0284c7; --red:#ef4444; --amber:#f59e0b; --green:#15803d;
    --sbw:232px; --sbc:54px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);padding-left:var(--sbw);transition:padding-left .15s;
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:inherit;text-decoration:none}
  header{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
    position:sticky;top:0;z-index:40;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.10)}
  header h1{font-size:18px;margin:0;font-weight:650}
  header .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .wrap{padding:22px 26px;max-width:1250px;margin:0 auto}
  .crumbs{color:var(--muted);font-size:13px;margin-bottom:14px}
  .crumbs a{color:var(--accent)}
  .grp{margin:26px 0 10px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    cursor:pointer;transition:border-color .12s,transform .12s;display:block}
  .card:hover{border-color:var(--accent);transform:translateY(-1px)}
  .card .num{color:var(--muted);font-size:12px;font-weight:700}
  .card h3{margin:4px 0 6px;font-size:15.5px;font-weight:640}
  .card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;margin-top:12px}
  .b-live{background:rgba(34,197,94,.15);color:#15803d}
  .b-soon{background:rgba(245,158,11,.13);color:#b45309}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;overflow:hidden}
  th,td{padding:10px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px;white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;background:#eef3f8}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#f5f7fa}
  .money{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .tbl-wrap{overflow-x:auto;border-radius:12px}
  button,.btn{background:var(--accent);color:#ffffff;border:0;border-radius:9px;padding:8px 14px;
    font-weight:640;cursor:pointer;font-size:13.5px}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .row-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input[type=date],input[type=month],input[type=search]{background:#ffffff;color:var(--txt);border:1px solid var(--line);
    border-radius:8px;padding:7px 10px;font-size:13.5px}
  #status{color:var(--muted);font-size:13px}
  .soon-box{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:26px;color:var(--muted)}
  .gate{position:fixed;inset:0;background:#f7f9fc;display:flex;align-items:center;justify-content:center;z-index:50}
  .gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:330px;text-align:center}
  .gate input{width:100%;padding:11px;margin:14px 0;border-radius:9px;border:1px solid var(--line);
    background:#ffffff;color:var(--txt);font-size:15px;text-align:center}
  .err{color:var(--red);font-size:13px;min-height:18px}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
  .days-hot{background:rgba(239,68,68,.15);color:#b91c1c}
  .days-warm{background:rgba(245,158,11,.15);color:#b45309}
  .days-ok{background:rgba(34,197,94,.13);color:#15803d}
  .charts-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
  @media(max-width:900px){.charts-row{grid-template-columns:1fr}}
  .chart-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .chart-card h3{margin:0 0 12px;font-size:14px;font-weight:640}
  .chart-card .cbox{height:260px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:4px}
  @media(max-width:700px){.kpis{grid-template-columns:1fr}}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  .kpi-t{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .kpi-v{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0 4px}
  .kpi-s{color:var(--muted);font-size:12.5px}
  .btn.ghost.active{background:var(--accent);color:#ffffff}
  input.dp{background:#ffffff;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13.5px;width:135px;cursor:pointer}
  input.dp:focus{outline:none;border-color:var(--accent)}
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sbw);background:#f3f5f8;border-right:1px solid var(--line);
    overflow-y:auto;z-index:45;transition:width .15s}
  body.sb-collapsed{padding-left:var(--sbc)}
  body.sb-collapsed #sidebar{width:var(--sbc)}
  .sb-head{display:flex;align-items:center;gap:8px;padding:16px 12px 10px}
  .sb-toggle{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;padding:0;flex:none}
  .sb-toggle:hover{color:var(--accent);border-color:var(--accent)}
  .sb-h-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;white-space:nowrap}
  body.sb-collapsed .sb-h-label{display:none}
  .sb-cat{padding:14px 14px 4px;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden}
  body.sb-collapsed .sb-cat{visibility:hidden;height:10px;padding:6px 0 0}
  .sb-item{display:flex;align-items:center;gap:9px;padding:8px 14px;color:var(--txt);font-size:13px;
    border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-decoration:none}
  .sb-item:hover{background:#eef3f8}
  .sb-item.active{background:#eef3f8;border-left-color:var(--accent);color:var(--accent)}
  .sb-num{color:var(--muted);font-size:11px;min-width:18px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
  .sb-item.active .sb-num{color:var(--accent)}
  .sb-title{overflow:hidden;text-overflow:ellipsis}
  body.sb-collapsed .sb-title{display:none}
  @media(max-width:700px){ body{padding-left:var(--sbc)} #sidebar{width:var(--sbc)} .sb-h-label,.sb-title{display:none} }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
</head>
<body>
  <div class="gate" id="gate">
    <div class="box">
      <div style="font-weight:650;font-size:16px">White Bay Villas</div>
      <div class="muted" style="font-size:13px;margin-top:4px">Reports</div>
      <input id="code" type="password" placeholder="Access code" autofocus />
      <div class="err" id="gateErr"></div>
      <button onclick="tryGate()" style="width:100%">Enter</button>
    </div>
  </div>

  <header>
    <div>
      <h1 id="hTitle">White Bay Villas — Reports</h1>
      <div class="sub" id="hSub">Select a report</div>
    </div>
    <div class="row-actions">
      <a class="btn ghost" href="#/">All reports</a>
      <span id="status"></span>
    </div>
  </header>

  <aside id="sidebar" aria-label="Reports navigation"></aside>

  <div class="wrap" id="app"></div>

<script>
  // ---- Config -------------------------------------------------------------
  const SUPABASE_URL = "https://oyxyhxuzufidxfdcwszo.supabase.co";
  const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95eHloeHV6dWZpZHhmZGN3c3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MzEwODYsImV4cCI6MjA5ODQwNzA4Nn0.-ZY7wFR2pdt3S9wzIoiOWkMCF9wDzTdIuEq_5KOsfMQ";
  const ACCESS_CODE = "wbv2026";

  // Fixed color + order per villa type — kept identical across every chart.
  const VILLA_ORDER = ['Hillside Villas','Palm Villa','Paradise Villas','Seaside Cottages','Sunset Villa East','Sunset Villa West','(unassigned)'];
  const VILLA_COLORS = {
    'Hillside Villas':'#38bdf8', 'Palm Villa':'#a855f7', 'Paradise Villas':'#22c55e',
    'Seaside Cottages':'#f59e0b', 'Sunset Villa East':'#ef4444', 'Sunset Villa West':'#ec4899',
    '(unassigned)':'#64748b'
  };

  const money = n => (n==null||n==='' ? '—' : '$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}));
  const dfmt  = s => { if(!s) return '—'; const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); const d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s); return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); };
  const cell  = (v,t)=>{
    if(v==null||v==='') return '<span class="muted">—</span>';
    if(t==='money') return '<span class="money">'+money(v)+'</span>';
    if(t==='date')  return '<span class="muted">'+dfmt(v)+'</span>';
    if(t==='strong')return '<strong>'+esc(v)+'</strong>';
    if(t==='bool')  return v===true||v==='true' ? '✔' : '—';
    if(t==='warn')  return v===true||v==='true' ? '<span style="color:#b91c1c;font-weight:600">⚠ Yes</span>' : '<span class="muted">—</span>';
    if(t==='pct')   return esc(v)+'%';
    if(t==='disc'){ const d=Number(v); if(isNaN(d)) return '<span class="muted">—</span>'; const c=d>=20?'#b91c1c':d>0?'#b45309':d<0?'#15803d':'#64748b'; const t2=d>0?('-'+d+'%'):(d<0?('+'+Math.abs(d)+'%'):'0%'); return '<span style="color:'+c+';font-weight:600">'+t2+(d>=20?' ⚠':'')+'</span>'; }
    if(t==='days'){ const d=Number(v)||0; const cls=d>=14?'days-hot':d>=7?'days-warm':'days-ok'; return '<span class="pill '+cls+'">'+d+'</span>'; }
    return esc(v);
  };
  const esc = s => String(s).replace(/&amp;/g,'&').replace(/&#0?39;/g,"'").replace(/&quot;/g,'"').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  // Report definitions. ready=true → data is flowing; false → waiting on a sync.
  const REPORTS = [
    { n:1, slug:'future-reservations', group:'Accounting (Christa)', ready:true,
      title:'Future Reservations',
      desc:'All upcoming reservations — guest, amount paid, date paid, balance due, booking date, source, check-in/out.',
      view:'rpt_future_reservations', order:'checkin.asc', dateField:'checkin', dateLabel:'check-in date',
      boolFilter:{field:'unassigned', label:'Unassigned only'},
      cols:[['guest_name','Guest','strong'],['room_assignment','Room / Villa'],['booking_source','Source'],['checkin','Check-in','date'],
            ['checkout','Check-out','date'],['amount_paid','Paid','money'],['balance_due','Balance','money'],
            ['last_payment_date','Date paid','date'],['date_of_booking','Booked','date'],['status','Status']] },

    { n:2, slug:'financial-revenue', group:'Accounting (Christa)', ready:true,
      title:'Financial / Revenue',
      desc:'Every payment — date, amount, CC type, source, room, guest, stay dates. Custom date range at run time.',
      topRevenue:true,
      view:'rpt_financial_transactions', order:'payment_date.desc', dateField:'payment_date', dateTS:true, dateLabel:'payment date',
      cols:[['payment_date','Payment date','date'],['amount_paid','Amount','money'],['cc_type','CC type'],
            ['booking_source','Source'],['room_unit','Room'],['room','Villa type'],['guest_name','Guest','strong'],
            ['checkin','Check-in','date'],['checkout','Check-out','date']] },

    { n:3, slug:'arrivals', group:'Reservations & Guest Services (Amy)', ready:true,
      title:'Arrivals (all guests)',
      desc:'Every guest on the reservation (not just the booker) with phone and email — who is in each villa.',
      view:'rpt_arrivals', order:'checkin.asc', dateField:'checkin', dateLabel:'check-in date',
      cols:[['checkin','Check-in','date'],['checkout','Check-out','date'],['room_type_id','Villa'],
            ['first_name','First'],['last_name','Last'],['email','Email'],['phone','Phone'],['is_primary','Booker','bool']] },

    { n:4, slug:'balance-due', group:'Reservations & Guest Services (Amy)', ready:true,
      title:'Balance Due',
      desc:'Guests who still owe a final balance, with contact info to follow up. (Contact fills in once the guests sync runs.)',
      view:'rpt_balance_due', order:'checkin.asc', dateField:'checkin', dateLabel:'check-in date',
      forwardPreset:{label:'Due now — arriving in ≤89 days', days:89},
      selectFilter:{field:'res_type', label:'Type'},
      charts:[
        {type:'bar', title:'Balance due — guests arriving within 89 days (due now) vs 90+ days', source:'rpt_balance_due_soon', groupBy:'bucket', agg:'balance_due', fmt:'money'}
      ],
      cols:[['reservation_id','Res #','strong'],['guest_name','Guest'],['res_type','Type'],['cc_on_file','Card on file'],['email','Email'],['phone','Phone'],['balance_due','Balance','money'],
            ['days_to_checkin','Days to check-in'],['booking_date','Booked','date'],['checkin','Check-in','date'],['checkout','Check-out','date'],['status','Status']] },

    { n:5, slug:'holds', group:'Reservations & Guest Services (Amy)', ready:true,
      title:'Holds / Confirmation Pending',
      desc:'Unconfirmed holds to follow up or cancel, with contact info. (Contact fills in once the guests sync runs.)',
      view:'rpt_holds', order:'days_pending.desc', dateField:'checkin', dateLabel:'check-in date',
      cols:[['guest_name','Guest','strong'],['days_pending','Days pending','days'],['booking_datetime','Created','date'],
            ['checkin','Check-in','date'],['checkout','Check-out','date'],['email','Email'],['phone','Phone']] },

    { n:13, slug:'in-house', group:'Reservations & Guest Services (Amy)', ready:true,
      title:'Guests In House',
      desc:'Guests currently staying — cell phone to call them, when they arrived, and days until check-out.',
      view:'rpt_in_house', order:'days_to_checkout.asc', dateField:'arrived', dateLabel:'arrival date',
      cols:[['guest_name','Guest','strong'],['phone','Phone'],['arrived','Arrived','date'],
            ['days_to_checkout','Days to check-out'],['checkout','Check-out','date'],['nights_so_far','Nights so far'],['balance','Balance','money']],
      section2:{ title:'All Guests In House (everyone currently staying — including additional guests on each booking)',
        view:'rpt_in_house_all_guests', order:'villa.asc,checkout.asc,is_primary.desc', chartsBelow:true,
        charts:[
          {type:'bar', title:'In-house occupancy by villa type (% of units filled right now)', source:'rpt_in_house_occupancy', groupBy:'villa', aggNum:'occupied', aggDen:'units', fmt:'pct'}
        ],
        cols:[['villa','Villa type'],['guest_name','Guest','strong'],['is_primary','Booker','bool'],['phone','Phone'],['email','Email'],
              ['arrived','Arrived','date'],['checkout','Check-out','date'],['days_to_checkout','Days to check-out']] } },

    { n:15, slug:'checked-out', group:'Reservations & Guest Services (Amy)', ready:true,
      title:'Recently Checked Out',
      desc:'Guests who checked out in the past month — the booker per reservation, plus all guests and checkouts by villa type.',
      view:'rpt_checked_out', order:'checked_out.desc',
      cols:[['guest_name','Guest','strong'],['phone','Phone'],['email','Email'],['arrived','Arrived','date'],
            ['checked_out','Checked out','date'],['nights','Nights'],['days_since_checkout','Days since'],['balance','Balance','money']],
      section2:{ title:'All Guests (everyone on these reservations — including additional guests on each booking)',
        view:'rpt_checked_out_all_guests', order:'villa.asc,checked_out.desc,is_primary.desc', chartsBelow:true,
        charts:[
          {type:'bar', title:'Checkouts by villa type (past month)', source:'rpt_checked_out_by_type', groupBy:'villa', agg:'checkouts', fmt:'num'}
        ],
        cols:[['villa','Villa type'],['guest_name','Guest','strong'],['is_primary','Booker','bool'],['phone','Phone'],['email','Email'],
              ['arrived','Arrived','date'],['checked_out','Checked out','date'],['days_since_checkout','Days since']] } },

    { n:6, slug:'deposit-gaps', group:'Reconciliation & Ops (Ken)', ready:true,
      title:'Reservation → Deposit Reconciliation',
      desc:'Confirmed reservations with no deposit posted — flags gaps to chase.',
      view:'rpt_deposit_gaps', order:'booking_datetime.desc', dateField:'booking_datetime', dateTS:true, dateLabel:'booking date',

        {type:'bar', title:'OTA (guest pays platform) vs Direct (deposit expected)', groupBy:'ota_group', agg:'n', fmt:'num'},
        {type:'bar', title:'Awaiting deposit — count by check-in month', groupBy:'checkin_month', agg:'n', sortKey:true, fmt:'num'},
        {type:'bar', title:'Awaiting deposit — by booking source', groupBy:'source', agg:'n', fmt:'num'}
      ],
      cols:[['reservation_id','Res #','strong'],['guest_name','Guest'],['phone','Phone'],['source','Source'],['checkin','Check-in','date'],['status','Status'],['booking_datetime','Booked','date'],['booking_value','Booking value','money'],['paid_to_date','Paid to date','money']] },

    { n:7, slug:'recon-cb-authnet', group:'Reconciliation & Ops (Ken)', ready:true,
      title:'CB vs Authorize.net Reconciliation',
      desc:'Authorize.net settled card deposits (by settlement date) — the source that ties to bank ACH: Visa/MC/Disc lump vs Amex separate. Filter by settlement date and Download CSV to match deposits. Monthly chart compares Cloudbeds-recorded vs gateway-settled (~0 = reconciled).',

      total:{sumField:'amount', countField:'n', label:'Settled (net of refunds)', unit:'transactions'},
      alert:{view:'rpt_authnet_exceptions', sumField:'amount', order:'settlement_date.desc'},
      section2:{title:'⚠ Settlement exceptions — card charges that failed and were not recaptured (tests & retried charges excluded)', view:'rpt_authnet_exceptions', order:'has_reservation.desc,amount.desc',
        cols:[['settlement_date','Last attempt','date'],['last_name','Last name'],['first_name','First'],['account_type','Card'],['account_number','Last 4'],['amount','Attempted','money'],['attempts','Attempts'],['has_reservation','Has reservation?','bool'],['transaction_status','Status']]},
      charts:[
        {type:'bar', title:'Settled deposits by day', source:'rpt_authnet_by_day', dateField:'settlement_date', groupBy:'settlement_date', agg:'settled_net', sortKey:true, dateKey:true, fmt:'money'},
        {type:'bar', title:'By card type — Visa/MC/Disc vs Amex (matches bank ACH lines)', source:'rpt_authnet_by_day', dateField:'settlement_date', groupBy:'card_group', agg:'settled_net', fmt:'money'},
        {type:'bar', title:'Cloudbeds recorded − Auth.net settled, by month (~0 = reconciled)', source:'rpt_authnet_recon_month', groupBy:'month', agg:'difference', sortKey:true, fmt:'money'}
      ],
      cols:[['settlement_date','Settled','date'],['last_name','Last name'],['first_name','First'],['account_type','Card'],['account_number','Last 4'],['amount','Amount','money'],['transaction_status','Status'],['invoice_number','CB ref']] },

    { n:8, slug:'occupancy', group:'Reconciliation & Ops (Ken)', ready:true,
      title:'Accurate Occupancy',
      desc:'Nightly occupancy — occupied villas vs sellable inventory (18 units). Filter by night; the monthly-average chart shows the trend. (Owner/maintenance blocks not yet synced, so sellable = full inventory for now.)',
      view:'rpt_occupancy', order:'night.asc', dateField:'night', dateGran:'day', dateLabel:'night',
      charts:[
        {type:'bar', title:'Average occupancy % by month', source:'rpt_occupancy_by_month', groupBy:'month', agg:'avg_occupancy_pct', sortKey:true, fmt:'pct'},
        {type:'line', title:'Occupancy % by night', groupBy:'night', agg:'occupancy_pct', sortKey:true, dateKey:true, fmt:'pct'}
      ],

        {type:'bar', title:'Reservations by booking source', source:'rpt_source_of_business_by_month', groupBy:'source', agg:'reservations', fmt:'num', dateField:'month'},

      ],
      cols:[['month_label','Booking month'],['source','Source'],['reservations','Res'],['room_nights','Room nights'],['revenue','Revenue','money']] },

    { n:10, slug:'rate-discounting', group:'Reconciliation & Ops (Ken)', ready:true,

             +'<button class="ghost btn" onclick="clearDates(\''+r.slug+'\')">Clear</button>';

      toolbar+='<span class="muted">Filter by '+esc(r.dateLabel||'date')+':</span> '

  function clearDates(slug){
    const f=document.getElementById('from'), t=document.getElementById('to');
    if(f){ if(f._flatpickr) f._flatpickr.clear(); else f.value=''; }
    if(t){ if(t._flatpickr) t._flatpickr.clear(); else t.value=''; }
    loadReport(slug);
  }
  function setDayPreset(slug, days){
    const to=new Date(), from=new Date(); from.setDate(from.getDate()-(days-1));
    const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const fe=document.getElementById('from'), te=document.getElementById('to');
    if(fe._flatpickr) fe._flatpickr.setDate(fmt(from),false); else fe.value=fmt(from);
    if(te._flatpickr) te._flatpickr.setDate(fmt(to),false); else te.value=fmt(to);
    loadReport(slug);
  }
  function csvCell(v){
    if(v==null) v='';
    v=String(v);
    var NL=String.fromCharCode(10);
    var needsQuote = v.indexOf(',')>=0 || v.indexOf('"')>=0 || v.indexOf(NL)>=0;
    if(v.indexOf('"')>=0) v=v.split('"').join('""');
    return needsQuote ? '"'+v+'"' : v;
  }
  function downloadCSV(){
    var c=window.__csv; if(!c||!c.rows){ return; }
    var NL=String.fromCharCode(10);
    var lines=[c.cols.map(function(x){return csvCell(x[1]);}).join(',')];
    c.rows.forEach(function(row){ lines.push(c.cols.map(function(x){return csvCell(row[x[0]]);}).join(',')); });
    var blob=new Blob([lines.join(NL)],{type:'text/csv;charset=utf-8'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='wbv-'+(c.name||'report')+'-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  }
  function toggleBoolFilter(slug){
    window.__bf = window.__bf || {};
    window.__bf[slug] = !window.__bf[slug];
    loadReport(slug);
  }
  function toggleBoolFilter2(slug, field){
    window.__bf2 = window.__bf2 || {};
    window.__bf2[slug] = window.__bf2[slug] || {};
    const next = !window.__bf2[slug][field];
    const rep = REPORTS.find(x=>x.slug===slug);
    if(rep && rep.boolFiltersExclusive){ window.__bf2[slug] = {}; }   // radio-style: one at a time
    window.__bf2[slug][field] = next;
    loadReport(slug);
  }
  function setForwardPreset(slug, days){
    const from=new Date(), to=new Date(); to.setDate(to.getDate()+days);
    const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const fe=document.getElementById('from'), te=document.getElementById('to');
    if(fe._flatpickr) fe._flatpickr.setDate(fmt(from),false); else fe.value=fmt(from);
    if(te._flatpickr) te._flatpickr.setDate(fmt(to),false); else te.value=fmt(to);
    loadReport(slug);
  }

  // Populate month/day dropdowns from the data (once), newest first.
  function populateDateSelects(r,rows){
    if(r.dateGran!=='month'&&r.dateGran!=='day') return;
    const f=document.getElementById('from'), t=document.getElementById('to');
    if(!f||!t||f.tagName!=='SELECT'||f.dataset.filled) return;
    let vals, label;
    if(r.dateGran==='month'){
      vals=[...new Set(rows.map(x=>String(x[r.dateField]||'').slice(0,7)).filter(Boolean))].sort().reverse();
      label=m=>{const [y,mo]=m.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo-1]+' '+y;};
    } else {
      vals=[...new Set(rows.map(x=>String(x[r.dateField]||'').slice(0,10)).filter(Boolean))].sort().reverse();
      label=d=>dfmt(d);
    }
    const opts='<option value="">Any</option>'+vals.map(v=>'<option value="'+v+'">'+label(v)+'</option>').join('');
    f.innerHTML=opts; t.innerHTML=opts; f.dataset.filled='1'; t.dataset.filled='1';
  }

  function dateSuffix(r){
    let s='';
    if(r.dateField){
      const f=document.getElementById('from')?.value, t=document.getElementById('to')?.value;
      if(r.dateGran==='month'){ if(f) s+=`&${r.dateField}=gte.${f}-01`; if(t) s+=`&${r.dateField}=lte.${t}-01`; }
      else { if(f) s+=`&${r.dateField}=gte.${f}`; if(t) s+=`&${r.dateField}=lte.${t}${r.dateTS?'T23:59:59':''}`; }
    }
    return s;
  }
  async function fetchView(view, order, suffix){
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${view}?select=*&order=${order}`+suffix,
      {headers:{apikey:ANON,Authorization:`Bearer ${ANON}`,'Accept-Profile':'wbv'}});
    if(!res.ok) throw new Error('HTTP '+res.status+' '+(await res.text()));
    return res.json();
  }
  async function renderAlert(r, suffix){
    const box=document.getElementById('alertBox'); if(!box) return;
    try{
      const rows=await fetchView(r.alert.view, r.alert.order||'submit_time_utc.desc', suffix);
      const n=rows.length, sum=rows.reduce((a,x)=>a+Math.abs(Number(x[r.alert.sumField]||0)),0);
      if(n===0){ box.innerHTML='<div style="background:#ecfdf5;border:1px solid var(--green);color:var(--green);padding:12px 14px;border-radius:10px;font-weight:600">✓ No settlement exceptions in this range — every card transaction settled cleanly.</div>'; }
      else { box.innerHTML='<div style="background:#fef2f2;border:1px solid var(--red);color:#b91c1c;padding:12px 14px;border-radius:10px;font-weight:600">⚠ '+n+' unresolved card exception'+(n===1?'':'s')+' ($'+Math.round(sum).toLocaleString()+') — charges that failed and were not recaptured. Rows with a reservation (✔) are the ones to chase; no reservation usually means the card declined during booking (nothing owed). Details below.</div>'; }
    }catch(e){ box.innerHTML=''; }
  }
  function tableHTML(cols, rows){
    let h='<table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'</tr></thead><tbody>';
    if(!rows.length) h+='<tr><td colspan="'+cols.length+'" class="muted">No rows.</td></tr>';
    else h+=rows.map(row=>'<tr>'+cols.map(c=>'<td>'+cell(row[c[0]],c[2])+'</td>').join('')+'</tr>').join('');
    return h+'</tbody></table>';
  }
  async function loadReport(slug){
    const r=REPORTS.find(x=>x.slug===slug);
    const st=document.getElementById('status'); st.textContent='Loading…';
    const suffix=dateSuffix(r);
    if(r.alert) renderAlert(r, suffix);
    destroyCharts();
    try{
      let rows=await fetchView(r.view, r.order, suffix);
      populateDateSelects(r,rows);
      if(r.boolFilter && window.__bf && window.__bf[slug]){
        rows=rows.filter(x=>x[r.boolFilter.field]===true);
        const b=document.getElementById('bfbtn'); if(b){ b.style.background='var(--accent)'; b.style.color='#fff'; }
      } else { const b=document.getElementById('bfbtn'); if(b){ b.style.background=''; b.style.color=''; } }
      if(r.boolFilters){
        const st2=(window.__bf2&&window.__bf2[slug])||{};
        r.boolFilters.forEach(function(bf){
          const on=!!st2[bf.field];
          if(on) rows=rows.filter(x=>x[bf.field]===true);
          const b=document.getElementById('bfbtn-'+bf.field);
          if(b){ b.style.background=on?'var(--accent)':''; b.style.color=on?'#fff':''; }
        });
      }
      if(r.selectFilter){
        const sel=document.getElementById('selfilter');
        if(sel && !sel.dataset.filled){
          const vals=[...new Set(rows.map(x=>x[r.selectFilter.field]).filter(v=>v!=null&&v!==''))].sort();
          sel.innerHTML='<option value="">All</option>'+vals.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
          sel.dataset.filled='1';
        }
        const sv=sel?sel.value:'';
        if(sv) rows=rows.filter(x=>String(x[r.selectFilter.field])===sv);
      }
      if(r.total){ const rt=document.getElementById('rangeTotal'); if(rt){
        const sum=rows.reduce((a,x)=>a+Number(x[r.total.sumField]||0),0);
        const cnt=r.total.countField?rows.reduce((a,x)=>a+Number(x[r.total.countField]||0),0):rows.length;
        const days=new Set(rows.map(x=>String(x[r.dateField]||'').slice(0,10)).filter(Boolean)).size;
        const fv=document.getElementById('from')?.value, tv=document.getElementById('to')?.value;
        const rng=(fv||tv)?((fv?dfmt(fv):'start')+' → '+(tv?dfmt(tv):'latest')):'all dates';
        rt.innerHTML='<div class="kpi" style="margin-bottom:16px"><div class="kpi-t">'+esc(r.total.label||'Total')+' · '+esc(rng)+'</div>'
          +'<div class="kpi-v" style="color:var(--green)">$'+Math.round(sum).toLocaleString()+'</div>'
          +'<div class="kpi-s">'+cnt.toLocaleString()+' '+esc(r.total.unit||'transactions')+' across '+days+' day'+(days===1?'':'s')+'</div></div>';
      } }
      window.__csv={cols:r.cols, rows:rows, name:r.slug};
      const tbl=document.getElementById('tbl'); if(tbl) tbl.innerHTML=tableHTML(r.cols, rows);
      await drawChartsInto(r.charts, rows, 'charts', 'ch');
      st.textContent=rows.length+' rows · updated '+new Date().toLocaleTimeString();
      if(r.section2){
        const s=r.section2;
        const rows2=await fetchView(s.view, s.order||r.order, suffix);
        const tbl2=document.getElementById('tbl2'); if(tbl2) tbl2.innerHTML=tableHTML(s.cols, rows2);
        await drawChartsInto(s.charts, rows2, 'charts2', 'c2');
      }
    }catch(e){
      const tbl=document.getElementById('tbl'); if(tbl) tbl.innerHTML='<p style="color:var(--red)">Could not load: '+esc(e.message||e)+'</p>';
      st.textContent='Error';
    }
  }

  // ---- Charts (optional, per report) --------------------------------------
  // Chart config: {type, title, groupBy, agg | (aggNum & aggDen for a ratio),
  //   fmt:'money'|'num'|'pct', source (optional other view), dateField, sortKey, dateKey}
  let CHARTINST=[];
  function destroyCharts(){ CHARTINST.forEach(c=>{try{c.destroy();}catch(e){}}); CHARTINST=[]; }
  async function drawChartsInto(charts, rows, hostId, prefix){
    const host=document.getElementById(hostId);
    if(!host) return;
    if(!charts||!charts.length){ host.innerHTML=''; return; }
    host.innerHTML='<div class="charts-row">'+charts.map((c,i)=>
      '<div class="chart-card"><h3>'+esc(c.title)+'</h3><div class="cbox"><canvas id="'+prefix+i+'"></canvas></div></div>').join('')+'</div>';
    const GRID={color:'#e4e8ee'}, TICK={color:'#64748b'};
    const fv=document.getElementById('from')?.value, tv=document.getElementById('to')?.value;
    for(let i=0;i<charts.length;i++){
      const c=charts[i];
      let data=rows;
      if(c.source){
        let u=`${SUPABASE_URL}/rest/v1/${c.source}?select=*`;
        if(c.dateField){
          const gd=v=>(v&&v.length===7)?v+'-01':v;
          if(fv) u+=`&${c.dateField}=gte.${gd(fv)}`;
          if(tv) u+=`&${c.dateField}=lte.${gd(tv)}`;
        }
        try{ const res=await fetch(u,{headers:{apikey:ANON,Authorization:`Bearer ${ANON}`,'Accept-Profile':'wbv'}}); data=res.ok?await res.json():[]; }catch(e){ data=[]; }
      }
      const num={}, den={};
      for(const row of data){ const k=row[c.groupBy]; if(k==null||k==='') continue;
        if(c.aggNum){ num[k]=(num[k]||0)+Number(row[c.aggNum]||0); den[k]=(den[k]||0)+Number(row[c.aggDen]||0); }
        else { num[k]=(num[k]||0)+Number(row[c.agg]||0); }
      }
      const ratioMul=c.fmt==='pct'?100:1;
      const val=k=>c.aggNum?(den[k]?ratioMul*num[k]/den[k]:0):num[k];
      let keys=Object.keys(num);
      if(c.groupBy==='villa') keys.sort((a,b)=>((VILLA_ORDER.indexOf(a)+1)||99)-((VILLA_ORDER.indexOf(b)+1)||99));
      else if(c.sortKey) keys.sort();
      else keys.sort((a,b)=>val(b)-val(a));
      const labels=keys.map(k=>c.dateKey?dfmt(k):k);
      const vals=keys.map(k=>Math.round(val(k)*10)/10);
      const colors=keys.map((k,j)=>c.groupBy==='villa'?(VILLA_COLORS[k]||`hsl(${200+j*34},70%,55%)`):`hsl(${200+j*34},70%,55%)`);
      const isLine=c.type==='line';
      const fmt=c.fmt||'money';
      const fmtV=v=>fmt==='money'?'$'+Number(v).toLocaleString():fmt==='pct'?Number(v)+'%':Number(v).toLocaleString();
      const el=document.getElementById(prefix+i); if(!el) continue;
      CHARTINST.push(new Chart(el,{ type:c.type,
        data:{ labels, datasets:[{ label:c.title, data:vals,
          backgroundColor:isLine?'rgba(56,189,248,.15)':colors,
          borderColor:isLine?'#38bdf8':colors, fill:isLine, tension:.3, pointRadius:2 }] },
        options:{ responsive:true, maintainAspectRatio:false,
          plugins:{ legend:{display:false}, tooltip:{callbacks:{label:ctx=>fmtV(ctx.parsed.y)}} },
          scales:{ x:{grid:GRID,ticks:TICK}, y:{grid:GRID,ticks:{color:'#64748b',callback:fmtV}, suggestedMax:fmt==='pct'?100:undefined} } } }));
    }
  }

  // ---- Revenue & Cash top section (Report #2) — v2.1 (checkin chart + future AR) ---
  let REVDATA=null, REVCHART=null, REVCHART2=null, REVPERIOD='ytd', REVFROM=null, REVTO=null;
  const REVH={apikey:ANON,Authorization:`Bearer ${ANON}`,'Accept-Profile':'wbv'};
  const monLabel=k=>{const[y,mo]=k.split('-');return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+mo-1]+' '+y;};
  async function renderRevenueTop(){
    const host=document.getElementById('revtop'); if(!host) return;
    host.innerHTML=
      '<div class="grp">Revenue &amp; Cash</div>'
     +'<div class="row-actions" style="margin-bottom:14px">'
     +'<button class="btn ghost rev-per" data-p="ytd" onclick="setRevPeriod(\'ytd\')">This year</button>'
     +'<button class="btn ghost rev-per" data-p="l12" onclick="setRevPeriod(\'l12\')">Last 12 months</button>'
     +'<button class="btn ghost rev-per" data-p="all" onclick="setRevPeriod(\'all\')">All time</button>'
     +'<span class="muted" style="margin-left:10px">or custom range:</span> '
     +'From <select id="revFrom" onchange="setRevRange()"></select> '
     +'To <select id="revTo" onchange="setRevRange()"></select>'
     +'</div>'
     +'<div class="kpis" id="revkpi"></div>'
     +'<div id="revfuture" style="margin-top:14px"></div>'
     +'<div class="chart-card" style="margin:16px 0 18px"><h3 id="revchartTitle">Revenue vs Cash by booking month</h3>'
     +'<p class="muted" style="margin:-6px 0 12px;font-size:12.5px">Grouped by <strong>when the booking was made</strong>, not when guests stay. Recent months look under-collected because most of what was booked then is for stays still upcoming — only the deposit (typically 50%) is in so far; the rest is due 90 days before check-in. Every booking whose stay has already passed is collected in full. For a fully-collected view of completed months, see the by-stay-month chart below.</p>'
     +'<div class="cbox" style="height:300px"><canvas id="revcanvas"></canvas></div></div>'
     +'<div class="chart-card" style="margin:0 0 22px"><h3 id="revchartTitle2">Revenue vs Cash by check-in (stay) month</h3>'
     +'<p class="muted" style="margin:-6px 0 12px;font-size:12.5px">Grouped by when guests actually stay. Past months are fully collected; upcoming months show only deposits in so far — the blue-over-green gap is the balance still owed (due 90 days before check-in).</p>'
     +'<div class="cbox" style="height:300px"><canvas id="revcanvas2"></canvas></div></div>';
    if(!REVDATA){
      try{
        const [rev,cash,chk,fut]=await Promise.all([
          fetch(`${SUPABASE_URL}/rest/v1/rpt_revenue_by_room_type?select=month,revenue`,{headers:REVH}).then(r=>r.json()),
          fetch(`${SUPABASE_URL}/rest/v1/rpt_cash_collected_by_room_type?select=month,collected`,{headers:REVH}).then(r=>r.json()),
          fetch(`${SUPABASE_URL}/rest/v1/rpt_by_checkin_month?select=checkin_month,revenue,collected`,{headers:REVH}).then(r=>r.json()),
          fetch(`${SUPABASE_URL}/rest/v1/rpt_future_to_collect`,{headers:REVH}).then(r=>r.json())
        ]);
        const bmap={};
        for(const r of rev){ const k=String(r.month).slice(0,7); (bmap[k]=bmap[k]||{rev:0,cash:0}).rev+=Number(r.revenue||0); }
        for(const r of cash){ const k=String(r.month).slice(0,7); (bmap[k]=bmap[k]||{rev:0,cash:0}).cash+=Number(r.collected||0); }
        const cmap={};
        for(const r of chk){ const k=String(r.checkin_month).slice(0,7); const o=(cmap[k]=cmap[k]||{rev:0,cash:0}); o.rev+=Number(r.revenue||0); o.cash+=Number(r.collected||0); }
        REVDATA={
          book:Object.keys(bmap).sort().map(k=>({mo:k,rev:bmap[k].rev,cash:bmap[k].cash})),
          checkin:Object.keys(cmap).sort().map(k=>({mo:k,rev:cmap[k].rev,cash:cmap[k].cash})),
          future:(Array.isArray(fut)?fut[0]:fut)||{future_balance:0,future_bookings:0,future_revenue:0}
        };
      }catch(e){ host.innerHTML+='<p style="color:var(--red)">Could not load revenue: '+esc(e.message||e)+'</p>'; return; }
    }
    drawRev();
  }
  function periodStart(p){
    const now=new Date(), y=now.getFullYear();
    if(p==='ytd') return `${y}-01`;
    if(p==='l12'){ const d=new Date(y,now.getMonth()-11,1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
    return '0000-00';
  }
  window.setRevPeriod=function(p){ REVPERIOD=p; REVFROM=null; REVTO=null; drawRev(); };
  window.setRevRange=function(){ let f=document.getElementById('revFrom').value, t=document.getElementById('revTo').value; if(f&&t){ if(f>t){ const x=f; f=t; t=x; } REVPERIOD='custom'; REVFROM=f; REVTO=t; drawRev(); } };
  function kpiCard(title,val,sub,color){
    return '<div class="kpi"><div class="kpi-t">'+esc(title)+'</div>'
      +'<div class="kpi-v" style="color:'+color+'">$'+Math.round(val).toLocaleString()+'</div>'
      +'<div class="kpi-s">'+esc(sub)+'</div></div>';
  }
  function drawRevBars(canvasId, rows, prev){
    const GRID={color:'#e4e8ee'}, TICK={color:'#64748b'}, fmtV=v=>'$'+Number(v).toLocaleString();
    const labels=rows.map(r=>monLabel(r.mo));
    const revV=rows.map(r=>Math.round(r.rev)), cashV=rows.map(r=>Math.round(r.cash));
    if(prev){try{prev.destroy();}catch(e){}}
    const c=new Chart(document.getElementById(canvasId),{type:'bar',
      data:{labels,datasets:[
        {label:'Revenue booked',data:revV,backgroundColor:'#38bdf8'},
        {label:'Cash collected',data:cashV,backgroundColor:'#22c55e'}
      ]},
      options:{responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:true,labels:{color:'#64748b',boxWidth:12}},tooltip:{callbacks:{label:ctx=>ctx.dataset.label+': '+fmtV(ctx.parsed.y)}}},
        scales:{x:{grid:GRID,ticks:TICK},y:{grid:GRID,ticks:{color:'#64748b',callback:fmtV}}}}});
    CHARTINST.push(c); return c;
  }
  function drawRev(){
    if(!REVDATA) return;
    const fSel=document.getElementById('revFrom'), tSel=document.getElementById('revTo');
    if(fSel && tSel && !fSel.dataset.filled){
      const months=[...new Set([...REVDATA.book.map(r=>r.mo), ...REVDATA.checkin.map(r=>r.mo)])].sort();
      const opts=months.map(m=>'<option value="'+m+'">'+monLabel(m)+'</option>').join('');
      fSel.innerHTML=opts; tSel.innerHTML=opts; fSel.dataset.filled='1'; tSel.dataset.filled='1';
      if(months.length){ fSel.value=months[0]; tSel.value=months[months.length-1]; }
    }
    let brows, crows, label;
    if(REVPERIOD==='custom' && REVFROM && REVTO){
      brows=REVDATA.book.filter(r=>r.mo>=REVFROM && r.mo<=REVTO);
      crows=REVDATA.checkin.filter(r=>r.mo>=REVFROM && r.mo<=REVTO);
      label=monLabel(REVFROM)+' – '+monLabel(REVTO);
      if(fSel) fSel.value=REVFROM; if(tSel) tSel.value=REVTO;
    } else {
      const start=periodStart(REVPERIOD);
      brows=REVDATA.book.filter(r=>r.mo>=start);
      crows=REVDATA.checkin.filter(r=>r.mo>=start);
      label={ytd:'Year to date',l12:'Last 12 months',all:'All time'}[REVPERIOD];
    }
    const totRev=brows.reduce((s,r)=>s+r.rev,0), totCash=brows.reduce((s,r)=>s+r.cash,0);
    document.getElementById('revkpi').innerHTML=
       kpiCard('Revenue booked · '+label,totRev,'Full value of bookings made in this period','var(--accent)')
      +kpiCard('Cash collected (deposits) · '+label,totCash,totRev>0?('$'+Math.round(totCash).toLocaleString()+' of $'+Math.round(totRev).toLocaleString()+' booked · '+Math.round(100*totCash/totRev)+'% collected'):'Deposits + payments received to date','var(--green)');
    const f=REVDATA.future;
    document.getElementById('revfuture').innerHTML=
      '<div class="kpi" style="border-color:var(--amber)">'
      +'<div class="kpi-t">Still to collect · all future bookings on file</div>'
      +'<div class="kpi-v" style="color:var(--amber)">$'+Math.round(Number(f.future_balance||0)).toLocaleString()+'</div>'
      +'<div class="kpi-s">Outstanding balance across '+Number(f.future_bookings||0).toLocaleString()+' upcoming bookings · $'+Math.round(Number(f.future_revenue||0)).toLocaleString()+' total booked value (balances due 90 days before check-in)</div></div>';
    document.querySelectorAll('.rev-per').forEach(b=>b.classList.toggle('active', REVPERIOD!=='custom' && b.dataset.p===REVPERIOD));
    document.getElementById('revchartTitle').textContent='Revenue vs Cash by booking month — '+label;
    document.getElementById('revchartTitle2').textContent='Revenue vs Cash by check-in (stay) month — '+label;
    REVCHART=drawRevBars('revcanvas', brows, REVCHART);
    REVCHART2=drawRevBars('revcanvas2', crows, REVCHART2);
  }
</script>
</body>
</html>
