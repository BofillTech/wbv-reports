<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>White Bay Villas — Quote Tool</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
<style>
:root{--bg:#ffffff;--panel:#ffffff;--line:#e4e8ee;--txt:#1b2430;--muted:#64748b;--accent:#0284c7;--green:#15803d;--amber:#f59e0b;--red:#ef4444;--sbw:232px;--sbc:54px;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);padding-left:var(--sbw);transition:padding-left .15s;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
.wrap{max-width:920px;margin:0 auto;padding:22px 26px}
header{padding:20px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:40;background:var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.10)}
header h1{font-size:18px;margin:0;font-weight:650}
.sub{color:var(--muted);font-size:13px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 16px;font-weight:640;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:var(--sbw);background:#f3f5f8;border-right:1px solid var(--line);overflow-y:auto;z-index:45;transition:width .15s}
body.sb-collapsed{padding-left:var(--sbc)}
body.sb-collapsed #sidebar{width:var(--sbc)}
.sb-head{display:flex;align-items:center;gap:8px;padding:16px 12px 10px}
.sb-toggle{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;padding:0;flex:none}
.sb-toggle:hover{color:var(--accent);border-color:var(--accent)}
.sb-h-label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;white-space:nowrap}
body.sb-collapsed .sb-h-label{display:none}
.sb-cat{padding:14px 14px 4px;color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden}
body.sb-collapsed .sb-cat{visibility:hidden;height:10px;padding:6px 0 0}
.sb-item{display:flex;align-items:center;gap:9px;padding:8px 14px;color:var(--txt);font-size:13px;border-left:3px solid transparent;white-space:nowrap;overflow:hidden;text-decoration:none}
.sb-item:hover{background:#eef3f8}
.sb-item.active{background:#eef3f8;border-left-color:var(--accent);color:var(--accent)}
.sb-num{color:var(--muted);font-size:11px;min-width:18px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.sb-item.active .sb-num{color:var(--accent)}
.sb-title{overflow:hidden;text-overflow:ellipsis}
body.sb-collapsed .sb-title{display:none}
@media(max-width:700px){ body{padding-left:var(--sbc)} #sidebar{width:var(--sbc)} .sb-h-label,.sb-title{display:none} }
.form{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:20px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.fld input,.fld select{border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;min-width:150px}
.card{border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.card h3{margin:0 0 12px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:9px 12px;border-bottom:1px solid var(--line)}
td.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.total td{border-top:2px solid var(--txt);border-bottom:none;font-weight:700;font-size:16px;padding-top:12px}
.kpis{display:flex;flex-wrap:wrap;gap:22px;margin-bottom:14px}
.kpi-t{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.kpi-v{font-size:22px;font-weight:700}
.avail-ok{color:var(--green);font-weight:600}
.avail-no{color:var(--red);font-weight:600}
.promo{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:10px 14px;font-size:13px;color:#075985;margin-top:6px}
.emailbox{position:relative}
.emailbox textarea{width:100%;min-height:230px;border:1px solid var(--line);border-radius:10px;padding:14px;font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",monospace;color:var(--txt);resize:vertical;background:#fbfdff}
.copybar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.copied{color:var(--green);font-size:13px;font-weight:600;opacity:0;transition:opacity .2s}
.copied.show{opacity:1}
.err{color:var(--red);font-weight:600}
.gate{position:fixed;inset:0;background:#f6f8fb;display:flex;align-items:center;justify-content:center}
.gate .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px;width:320px;text-align:center}
.gate input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:14px 0}
.gate button{width:100%;padding:10px;background:var(--accent);color:#fff;border:0;border-radius:8px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="box"><strong>White Bay Villas</strong><div class="sub">Quote Tool</div><input id="code" placeholder="Access code" type="password" onkeydown="if(event.key==='Enter')checkGate()"/><button onclick="checkGate()">Enter</button></div></div>
<aside id="sidebar" aria-label="Reports navigation"></aside>
<header>
  <div><h1>19. Quote Tool</h1><div class="sub">Live rates from Cloudbeds — email a quote and encourage a direct booking</div></div>
  <div><a class="btn ghost" href="index.html">All reports</a></div>
</header>
<div class="wrap" id="app" style="display:none">
  <div class="form">
    <div class="fld"><label>Check-in</label><input type="text" id="ci" placeholder="Select date"></div>
    <div class="fld"><label>Check-out</label><input type="text" id="co" placeholder="Select date"></div>
    <div class="fld"><label>Villa</label>
      <select id="villa">
        <option value="225457093910720">Paradise Villas</option>
        <option value="225457324298432">Seaside Cottages</option>
        <option value="225456863682752">Hillside Villas</option>
        <option value="225457611034752">Sunset Villa East</option>
        <option value="225457753321600">Sunset Villa West</option>
        <option value="225457911496896">Palm Villa</option>
      </select>
    </div>
    <button class="btn" id="go" onclick="getQuote()">Get quote</button>
  </div>
  <div id="out"></div>
</div>
<script>
const SUPABASE_URL='https://oyxyhxuzufidxfdcwszo.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95eHloeHV6dWZpZHhmZGN3c3pvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MzEwODYsImV4cCI6MjA5ODQwNzA4Nn0.-ZY7wFR2pdt3S9wzIoiOWkMCF9wDzTdIuEq_5KOsfMQ';
const BOOKING_URL='https://us2.cloudbeds.com/reservation/hj40Sd';
// ---- Sidebar (mirrors the hub) -----------------------------------------
const REPORTS=[
  {n:1,slug:'future-reservations',t:'Future Reservations'},
  {n:2,slug:'financial-revenue',t:'Financial / Revenue'},
  {n:3,slug:'arrivals',t:'Arrivals (all guests)'},
  {n:4,slug:'balance-due',t:'Balance Due'},
  {n:5,slug:'holds',t:'Holds / Confirmation Pending'},
  {n:6,slug:'deposit-gaps',t:'Reservation → Deposit Reconciliation'},
  {n:7,slug:'recon-cb-authnet',t:'CB vs Authorize.net Reconciliation'},
  {n:8,slug:'occupancy',t:'Accurate Occupancy'},
  {n:9,slug:'source-of-business',t:'Source of Business'},
  {n:10,slug:'rate-discounting',t:'Rate Discounting'},
  {n:11,slug:'revenue-by-room-type',t:'Revenue by Room Type'},
  {n:12,slug:'payment-processing',t:'Payment Processing'},
  {n:13,slug:'in-house',t:'Guests In House'},
  {n:14,slug:'monthly-report',t:'Monthly Executive Report',page:'monthly.html'},
  {n:15,slug:'checked-out',t:'Recently Checked Out'},
  {n:16,slug:'reviews',t:'Reviews',page:'reviews.html'},
  {n:17,slug:'imported-reservations',t:'Imported Reservations'},
  {n:18,slug:'last-minute',t:'Last-Minute Reservations'},
  {n:19,slug:'quote',t:'Quote Tool',page:'quote.html'}
];
const CATS=[['Operations',[1,3,5,13,15,8,17,18,19]],['Finance & Payments',[2,4,6,7,12]],['Sales & Revenue Management',[9,10,11]],['Executive',[14]],['Reputation',[16]]];
const REP_BY_N={}; REPORTS.forEach(r=>{REP_BY_N[r.n]=r;});
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c];}); }
function buildSidebar(){
  const sb=document.getElementById('sidebar'); if(!sb) return;
  let items='<a class="sb-item" href="index.html"><span class="sb-num">•</span><span class="sb-title">All reports</span></a>';
  for(const [cat,nums] of CATS){
    items+='<div class="sb-cat">'+esc(cat)+'</div>';
    for(const n of nums){
      const r=REP_BY_N[n]; if(!r) continue;
      const href=r.page?r.page:'index.html#/'+r.slug;
      const active=r.slug==='quote'?' active':'';
      items+='<a class="sb-item'+active+'" href="'+href+'" title="'+esc(r.n+' · '+r.t)+'">'
           +'<span class="sb-num">'+r.n+'</span><span class="sb-title">'+esc(r.t)+'</span></a>';
    }
  }
  sb.innerHTML='<div class="sb-head"><button class="sb-toggle" onclick="toggleSidebar()" title="Collapse / expand">☰</button>'
    +'<span class="sb-h-label">Reports</span></div>'+items;
}
window.toggleSidebar=function(){ document.body.classList.toggle('sb-collapsed'); try{ localStorage.setItem('wbv_sb', document.body.classList.contains('sb-collapsed')?'1':'0'); }catch(e){} };
buildSidebar();
try{ if(localStorage.getItem('wbv_sb')==='1') document.body.classList.add('sb-collapsed'); }catch(e){}

let fpCI=null, fpCO=null;
function initPickers(){
  if(fpCI||typeof flatpickr==='undefined') return;
  const today=new Date();
  fpCI=flatpickr('#ci',{dateFormat:'Y-m-d',minDate:today,onChange:function(d){ if(fpCO&&d[0]){ fpCO.set('minDate', new Date(d[0].getTime()+86400000)); } }});
  fpCO=flatpickr('#co',{dateFormat:'Y-m-d',minDate:new Date(today.getTime()+86400000)});
}
function checkGate(){ if(document.getElementById('code').value.trim()==='wbv2026'){ localStorage.setItem('wbv_rev','1'); showApp(); } else { document.getElementById('code').value=''; document.getElementById('code').placeholder='Try again'; } }
function showApp(){ document.getElementById('gate').style.display='none'; document.getElementById('app').style.display='block'; initPickers(); }
if(localStorage.getItem('wbv_rev')==='1'){ window.addEventListener('DOMContentLoaded',showApp); }

const money=n=>'$'+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const longDate=s=>{ const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); const d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s); return d.toLocaleDateString(undefined,{weekday:'short',month:'long',day:'numeric',year:'numeric'}); };
const shortDate=s=>{ const m=String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); const d=m?new Date(+m[1],+m[2]-1,+m[3]):new Date(s); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}); };

async function getQuote(){
  const ci=document.getElementById('ci').value, co=document.getElementById('co').value;
  const villa=document.getElementById('villa').value;
  const out=document.getElementById('out');
  if(!ci||!co){ out.innerHTML='<p class="err">Please pick both a check-in and check-out date.</p>'; return; }
  const btn=document.getElementById('go'); btn.disabled=true; btn.textContent='Getting quote…';
  out.innerHTML='<p class="sub">Checking live rates in Cloudbeds…</p>';
  let d;
  try{
    const r=await fetch(SUPABASE_URL+'/functions/v1/quote',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+ANON},body:JSON.stringify({startDate:ci,endDate:co,roomTypeID:villa})});
    d=await r.json();
  }catch(e){ out.innerHTML='<p class="err">Could not reach the quote service: '+esc(e)+'</p>'; btn.disabled=false; btn.textContent='Get quote'; return; }
  btn.disabled=false; btn.textContent='Get quote';
  if(!d||!d.ok){ out.innerHTML='<p class="err">'+esc(d&&d.error?d.error:'No quote available for those dates.')+'</p>'; return; }
  render(d);
}

function render(d){
  const avail = d.roomsAvailable>0
    ? '<span class="avail-ok">'+d.roomsAvailable+' available</span>'
    : '<span class="avail-no">None available for these dates</span>';
  let rows=d.lines.map(l=>'<tr><td>'+esc(l.label)+'</td><td class="amt">'+money(l.amount)+'</td></tr>').join('');
  rows+='<tr class="total"><td>Total</td><td class="amt">'+money(d.grandTotal)+'</td></tr>';
  const bookLink=BOOKING_URL+'?checkin='+d.startDate+'&checkout='+d.endDate;
  document.getElementById('out').innerHTML=
    '<div class="card"><h3>'+esc(d.roomTypeName)+' — '+longDate(d.startDate)+' to '+longDate(d.endDate)+'</h3>'
    +'<div class="kpis"><div><div class="kpi-t">Nights</div><div class="kpi-v">'+d.nights+'</div></div>'
    +'<div><div class="kpi-t">Avg / night (room)</div><div class="kpi-v">'+money(d.nightlyAvg)+'</div></div>'
    +'<div><div class="kpi-t">Total</div><div class="kpi-v" style="color:var(--green)">'+money(d.grandTotal)+'</div></div>'
    +'<div><div class="kpi-t">Availability</div><div class="kpi-v" style="font-size:16px;padding-top:5px">'+avail+'</div></div></div>'
    +'<table>'+rows+'</table></div>'
    +'<div class="card"><h3>Copy &amp; paste this reply to the guest</h3>'
    +'<div class="copybar"><button class="btn" onclick="copyEmail()">Copy to clipboard</button><span class="copied" id="copied">Copied ✓</span>'
    +'<a class="btn ghost" href="'+bookLink+'" target="_blank" rel="noopener">Open booking link</a></div>'
    +'<div class="emailbox"><textarea id="email" readonly>'+esc(buildEmail(d,bookLink))+'</textarea></div></div>';
}

function buildEmail(d, bookLink){
  const NL='\n';
  let t='Here is your quote for the dates you requested:'+NL+NL;
  t+=d.roomTypeName+'  ·  '+longDate(d.startDate)+'  to  '+longDate(d.endDate)+'  ('+d.nights+' night'+(d.nights>1?'s':'')+')'+NL+NL;
  d.lines.forEach(l=>{ t+='  '+padRight(l.label,42)+money(l.amount)+NL; });
  t+='  '+padRight('TOTAL',42)+money(d.grandTotal)+NL+NL;
  t+='You can book this online here:'+NL+bookLink+NL+NL;
  t+='Just enter '+shortDate(d.startDate)+' to '+shortDate(d.endDate)+' (per above), select the '+d.roomTypeName+', and follow the quick, easy checkout process.'+NL+NL;
  t+='We look forward to welcoming you to White Bay Villas on Jost Van Dyke!';
  return t;
}
function padRight(s,n){ s=String(s); return s.length>=n ? s+'  ' : s+' '.repeat(n-s.length); }
function copyEmail(){
  const ta=document.getElementById('email'); ta.select(); ta.setSelectionRange(0,99999);
  navigator.clipboard.writeText(ta.value).then(function(){ const c=document.getElementById('copied'); c.classList.add('show'); setTimeout(()=>c.classList.remove('show'),1800); }).catch(function(){ document.execCommand('copy'); });
}
</script>
</body>
</html>
